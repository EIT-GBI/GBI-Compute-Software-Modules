[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbi-archive-codec"
dynamic = ["version"]
description = "GBI portable archive codec shared by transfer runtimes"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src/lib"}
packages = ["gbi_data"]

[tool.setuptools.dynamic]
version = {attr = "gbi_data.__version__"}
