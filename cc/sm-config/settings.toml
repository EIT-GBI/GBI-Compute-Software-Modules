[env]
# The zig release behind the shims: `module load zig/<this>` at install time,
# `depends_on` at load time. The module is versioned by it -- the shims are
# only as stable as `zig cc`'s flag handling, which shifts between zig
# releases (the 0.15 -> 0.16 differences already sent ncdu's recipe on a
# detour), and that is exactly what a bump of this list re-tests.
INSTALL_VERSION = "{INSTALL_VERSION}"
# Oldest glibc in the fleet. Everything built through the shims links against
# zig's bundled stubs of exactly this glibc, so it runs on any host with this
# version or newer -- whatever the build host runs. Ubuntu 22.04 (the OOD
# host, where modules are built) is 2.35; the 24.04 slurm images are 2.39.
# Raise it only when the oldest host does. Ignored on macOS.
GLIBC_FLOOR  = "2.35"
RUNTIME_OS   = "{RUNTIME_OS}"
RUNTIME_ARCH = "{RUNTIME_ARCH}"

[install]
versions = ["0.16.0"]
prefix = "{SITE_DESTINATION}/{STAGE_DIR}"
# note: this is Lua regex: you will need to escape - and + (using %)
format = "^downloaded$"
# (optional) relocate after install
destination = "{SITE_DESTINATION}/{INSTALL_VERSION_VARIANT}"
stage = true

[module]
PATH = "{INSTALL_DIR}"
INSTALL_VERSION = "{INSTALL_VERSION}"

[post]
# toggles mandatory relocate if `stage` and `clean` are true. If the install
# script already relocates the package, then we can set `safe = false`
safe = true
# delete staging area after successful install
clean = true
