[env]
# Install straight into the final prefix (no staging): uv writes absolute
# paths into the venv, so the tree must not move after the install
INSTALL_ROOT = "{SITE_DESTINATION}/{INSTALL_VERSION_VARIANT}"
# Self-contained python, shared by every version of this module
UV_PYTHON_PREFERENCE  = "only-managed"
UV_PYTHON_INSTALL_DIR = "{SITE_DESTINATION}/python"
VERSION = "{INSTALL_VERSION}"
# The GitHub release tarball of that tag, and the commit it was cut from.
# Bump all three together; install.sh refuses a tarball with another digest.
LUSTRE_DLM_SHA256 = "5bf1fc564061a36e5a16bf47b78d2b9eead1dd7694aa6ecac501e97524c32f7f"
LUSTRE_DLM_COMMIT = "877984ab205080e7b66ac0f80d7b38746b1ff31f"

[install]
versions = ["0.2.5"]
prefix = "{SITE_DESTINATION}"
# note: this is Lua regex: you will need to escape - and + (using %)
format = "^{INSTALL_VERSION_VARIANT}$"
# install.sh already installs into the final destination => the relocate pass
# sees source == destination and leaves the tree in place
destination = "{SITE_DESTINATION}/{INSTALL_VERSION_VARIANT}"
stage = false

[module]
PATH = "{INSTALL_DIR}/bin"
INSTALL_VERSION = "{INSTALL_VERSION}"

[post]
# no staging dir is used => nothing to relocate or clean up
safe = true
clean = false
