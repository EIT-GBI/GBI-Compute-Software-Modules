# Parameters of the `uv` template: `module load uv; uv tool install` from
# PyPI. This is the default-mode recipe for python tools -- installing through
# the package manager is the only route, so no separate sm-config-build is
# rendered.
#
# Unlike the staged recipes, the rendered recipe installs straight into the
# final prefix (stage = false): `uv tool install` writes absolute paths into
# the tool's shims and venv, so the tree must not move after the install.
#
# Required (no default below => rendering fails without them):
#   name      module name and PyPI package name (positional argument 2 of
#             templates/render.sh)
#   version   initial entry of [install].versions (positional argument 3);
#             `stable` installs whatever the latest PyPI release is

[constant]
# One-line description, shown by `make help` (or edit the rendered sm-help)
summary = "installed with uv from PyPI"

# Re-emit these simple-modules placeholders verbatim, so that `{{{...}}}`
# survives template expansion and is filled in later by simple-modules.
INSTALL_VERSION = "{{{INSTALL_VERSION}}}"
PATH = "{{{PATH}}}"
